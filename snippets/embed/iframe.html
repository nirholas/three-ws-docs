<!-- Embed a published agent where you cannot load scripts (a CMS, a sandboxed page).
     Replace AGENT_ID with the id from the agent's page. -->
<iframe
  src="https://three.ws/agent/AGENT_ID/embed"
  width="400"
  height="500"
  frameborder="0"
  allow="camera; microphone; xr-spatial-tracking"
  title="three.ws agent"
></iframe>
